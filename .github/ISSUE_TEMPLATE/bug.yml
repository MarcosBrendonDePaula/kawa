name: "🐛 Bug"
description: Relatar um problema no app ou site
labels: [bug]
body:
  - type: textarea
    id: oque
    attributes:
      label: O que aconteceu?
      description: Descreva o problema e o que você esperava.
    validations: { required: true }
  - type: dropdown
    id: plataforma
    attributes:
      label: Onde?
      options: [Android, Android TV / Fire TV, Windows, Linux, Site (navegador)]
    validations: { required: true }
  - type: input
    id: aparelho
    attributes:
      label: Aparelho / SO
      placeholder: "ex.: Samsung S21, Android 14 / Windows 11"
  - type: input
    id: versao
    attributes:
      label: Versão do app
      placeholder: "ex.: v0.2.0"
  - type: textarea
    id: passos
    attributes:
      label: Como reproduzir
      placeholder: "1. ... 2. ... 3. ..."
