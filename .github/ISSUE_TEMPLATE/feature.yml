name: "💡 Sugestão"
description: Sugerir uma melhoria ou recurso
labels: [enhancement]
body:
  - type: textarea
    id: ideia
    attributes:
      label: Sua ideia
      description: O que você gostaria que o Kawa fizesse?
    validations: { required: true }
  - type: textarea
    id: motivo
    attributes:
      label: Por quê?
      description: Que problema isso resolve pra você?
